services:
  hjportfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: hjportfolio:latest
    container_name: hjportfolio
    restart: unless-stopped
    ports:
      - "4082:4082"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4082
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"